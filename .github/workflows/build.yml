name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    # Pinned instead of ubuntu-latest: that label is migrating to Ubuntu 26,
    # which would move the preinstalled SDK path underneath us.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The runner image already ships an Android SDK. The setup-android
      # action is deliberately not used: it tries to install the "tools"
      # package, which Google removed from the repository, and fails.
      - name: Locate Android SDK
        run: |
          if [ ! -d "$ANDROID_HOME" ]; then
            CANDIDATE=$(ls -d /usr/local/lib/android/sdk /opt/android-sdk /usr/lib/android-sdk 2>/dev/null | head -1)
            if [ -z "$CANDIDATE" ]; then
              echo "Geen Android SDK gevonden op deze runner"; exit 1
            fi
            echo "ANDROID_HOME fallback: $CANDIDATE"
            echo "ANDROID_HOME=$CANDIDATE" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$CANDIDATE" >> "$GITHUB_ENV"
          fi
          ls "$ANDROID_HOME"

      - name: Install required SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: cnfixer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
