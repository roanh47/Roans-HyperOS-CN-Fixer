name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    # Pinned instead of ubuntu-latest: that label is migrating to Ubuntu 26,
    # which would move the preinstalled SDK path underneath us.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The runner image already ships an Android SDK. The setup-android
      # action is deliberately not used: it tries to install the "tools"
      # package, which Google removed from the repository, and fails.
      - name: Locate Android SDK
        run: |
          if [ ! -d "$ANDROID_HOME" ]; then
            CANDIDATE=$(ls -d /usr/local/lib/android/sdk /opt/android-sdk /usr/lib/android-sdk 2>/dev/null | head -1)
            if [ -z "$CANDIDATE" ]; then
              echo "Geen Android SDK gevonden op deze runner"; exit 1
            fi
            echo "ANDROID_HOME fallback: $CANDIDATE"
            echo "ANDROID_HOME=$CANDIDATE" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$CANDIDATE" >> "$GITHUB_ENV"
          fi
          ls "$ANDROID_HOME"

      - name: Install required SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

          # The key grabber is compiled by CMake, so the NDK must be present.
          NDK_VERSION="27.0.12077973"
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            echo "Installing NDK $NDK_VERSION"
            yes | "$SDKMANAGER" "ndk;$NDK_VERSION" > /dev/null
          fi
          ls "$ANDROID_HOME/ndk"

      # Every release has to be signed with the same key, otherwise Android
      # refuses to install it over the previous one. The keystore lives in
      # repository secrets and never in the tree.
      - name: Materialise the signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.CNFIXER_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/cnfixer-release.jks"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
            echo "CNFIXER_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "Signing with the stored release keystore"
          else
            echo "::warning::CNFIXER_KEYSTORE_B64 is missing, this APK gets a throwaway key and will not update over an existing install"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        env:
          CNFIXER_KEYSTORE_PASSWORD: ${{ secrets.CNFIXER_KEYSTORE_PASSWORD }}
          CNFIXER_KEY_ALIAS: ${{ secrets.CNFIXER_KEY_ALIAS }}
          CNFIXER_KEY_PASSWORD: ${{ secrets.CNFIXER_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      # Android shows the asset filename when installing, and an asset called
      # app-debug.apk from three different releases is confusing, so the file
      # carries the version. The version is read from the build, not typed.
      - name: Name the APK after its version
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          NAME="Roans-HyperOS-CN-Fixer-${VERSION}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "path=dist/$NAME" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
